<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ BRAND }}{% endblock %}</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/app.css?v={{ VERSION }}">
<script src="/static/app.js?v={{ VERSION }}"></script>
<script src="/static/htmx.min.js"></script>
<script src="/static/sse.min.js"></script>
</head>
<body hx-ext="sse" sse-connect="/events">
<header class="top">
  <a class="brand" href="/"><span class="logo"></span>{{ BRAND }}</a>
  <nav>{% set path = request.url.path %}<a href="/"{% if path == '/' or path.startswith('/a/') %} class="on"{% endif %}>Applications</a><a href="/advisories"{% if path.startswith('/advisories') %} class="on"{% endif %}>Advisories</a></nav>
  <div class="right">
    <span id="conn" class="conn" title="Connecting"><i></i><span>Offline</span></span>
    <button id="theme" class="iconbtn" title="Theme" aria-label="Switch theme"><svg class="i"><use href="/static/icons.svg#auto"/></svg></button>
    {% if user %}<span>{{ user.login }}</span><a href="/auth/logout">Sign out</a>{% elif auth_enabled %}<a class="btn" href="/auth/login?next={{ request.url.path }}">Sign in</a>{% else %}<span class="pill plain" title="Sign-in isn't configured here">Read-only</span>{% endif %}
  </div>
</header>
<main>{% if msg %}<div class="flash">{{ msg }}</div>{% endif %}{% block body %}{% endblock %}</main>
<footer><span>{{ BRAND }} {{ VERSION }}</span><span><code>{{ COMMIT[:7] }}</code></span></footer>
</body>
</html>
