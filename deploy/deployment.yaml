apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard}
spec:
  # no replicas: KEDA owns the replica count (0 when idle)
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata:
      labels: {app: dashboard}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532          # so the mounted Secret (0440) is readable
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: dashboard
        image: app-image
        ports: [{name: http, containerPort: 8080}]
        # This instance's names (FORGE_URL, STATE_REPO, CLUSTER, DASHBOARD_BRAND, COMPLIANCE_REPO,
        # FACTORY_REPO, ...), from ConfigMap dashboard-instance, made out of band per instance; the
        # code's defaults are ffwf's. The theme (colours, logo) is ConfigMap dashboard-theme, key theme.css.
        envFrom: [{configMapRef: {name: dashboard-instance, optional: true}}]
        env:
        - {name: DASHBOARD_THEME, value: /etc/dashboard-theme/theme.css}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 1
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: oauth, mountPath: /var/run/secrets/dashboard-oauth, readOnly: true}
        - {name: platform, mountPath: /var/run/secrets/dashboard-platform, readOnly: true}
        - {name: factory, mountPath: /var/run/secrets/dashboard-factory, readOnly: true}
        - {name: theme, mountPath: /etc/dashboard-theme, readOnly: true}
        - {name: ca-bundle, mountPath: /etc/ca-bundle, readOnly: true}
      volumes:
      - {name: theme, configMap: {name: dashboard-theme, optional: true}}
      # an organisation's CA bundle (key bundle.pem: public roots plus its private CA), for a forge
      # behind a private CA; dashboard-instance then sets SSL_CERT_FILE=/etc/ca-bundle/bundle.pem
      - {name: ca-bundle, configMap: {name: ca-bundle, optional: true}}
      - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
      # the forge OAuth2 client and session key, as files (not env vars); created out of band in
      # dev and prod only, so branch environments run read-only (their hosts aren't registered
      # redirect URIs anyway)
      - {name: oauth, secret: {secretName: dashboard-oauth, optional: true, defaultMode: 0440}}
      # the platform token (dispatches cicd-ref-arch's pipeline: webhooks, self-service) and the
      # forge webhook's secret, files `token` and `hook-secret`; out of band, dev and prod only
      - {name: platform, secret: {secretName: dashboard-platform, optional: true, defaultMode: 0440}}
      # the software factory's API token (ffwf/cicd-factory's controller, kubecon2026shenanigans
      # fleet/apps/factory), file `token`; out of band, dev and prod only
      - {name: factory, secret: {secretName: dashboard-factory, optional: true, defaultMode: 0440}}
